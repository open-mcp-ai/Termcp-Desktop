name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version in vX.Y.Z format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.version || github.ref_name }}

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and normalise version
        id: version
        shell: bash
        run: node scripts/set-release-version.mjs "$RELEASE_REF" >> "$GITHUB_OUTPUT"

  test:
    name: Cross-platform tests
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build:
    name: Package (${{ matrix.name }})
    needs: [metadata, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            slug: linux-amd64
            platform: linux/amd64
          - name: Windows amd64
            os: windows-latest
            slug: windows-amd64
            platform: windows/amd64
          - name: macOS arm64
            os: macos-15
            slug: macos-arm64
            platform: darwin/arm64
          - name: macOS Intel
            os: macos-15-intel
            slug: macos-amd64
            platform: darwin/amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply release version
        shell: bash
        run: node scripts/set-release-version.mjs "${{ needs.metadata.outputs.version }}"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ldflags="-X github.com/open-mcp-ai/termcp/gui/internal/config.ProductVersion=$VERSION"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform linux/amd64 -tags webkit2_41 -ldflags "$ldflags"
          mkdir -p artifacts/linux
          install -m 0755 build/bin/Termcp artifacts/linux/Termcp
          cp LICENSE README.md artifacts/linux/
          tar -C artifacts/linux -czf "artifacts/Termcp-$VERSION-linux-amd64.tar.gz" .
          rm -r artifacts/linux

      - name: Build Windows installer and portable package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ldflags = "-X github.com/open-mcp-ai/termcp/gui/internal/config.ProductVersion=$env:VERSION"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform windows/amd64 -nsis -ldflags $ldflags
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem build/bin -Filter '*-amd64-installer.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Wails did not produce an NSIS installer.' }
          Copy-Item $installer.FullName "artifacts/Termcp-$env:VERSION-windows-amd64-setup.exe"
          Compress-Archive -Path build/bin/Termcp.exe, LICENSE, README.md -DestinationPath "artifacts/Termcp-$env:VERSION-windows-amd64-portable.zip"

      - name: Build macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          ldflags="-X github.com/open-mcp-ai/termcp/gui/internal/config.ProductVersion=$VERSION"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform "$PLATFORM" -ldflags "$ldflags"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/bin/Termcp.app "artifacts/Termcp-$VERSION-$SLUG.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: Termcp-${{ matrix.slug }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: Termcp-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Termcp-* > SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Termcp $VERSION" \
              --generate-notes
          fi
